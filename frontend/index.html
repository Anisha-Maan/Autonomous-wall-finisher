<!doctype html>
<html>
<head>
  <meta charset="utf-8" />
  <title>Autonomous Wall Finisher — Demo</title>
  <link rel="stylesheet" href="./styles.css" />
  <style>
    #obstacles-section { margin-top:15px; border:1px solid #ccc; padding:10px; }
    #obstacles-section input { width:60px; margin-right:5px; }
    #obstacle-list div { font-size:0.9em; margin-top:2px; }
    canvas { border:1px solid #000; margin-top:10px; background:#fff; }
  </style>
</head>
<body>
<div class="container">
  <h1>Autonomous Wall Finisher — Demo</h1>

  <div class="controls">
    <label>Width (m): <input id="w" value="5" /></label>
    <label>Height (m): <input id="h" value="5" /></label>
    <label>Brush (m): <input id="brush" value="0.05" /></label>
    <button id="planBtn">Plan & Save</button>
    <button id="loadLast">Load Last</button>
  </div>

  <div id="obstacles-section">
    <h3>Obstacles</h3>
    <div id="obstacle-list">No obstacles yet</div>
    <input type="number" id="obsX" placeholder="X (m)" step="0.01">
    <input type="number" id="obsY" placeholder="Y (m)" step="0.01">
    <input type="number" id="obsW" placeholder="Width (m)" step="0.01">
    <input type="number" id="obsH" placeholder="Height (m)" step="0.01">
    <button id="addObstacleBtn">Add Obstacle</button>
  </div>

  <canvas id="cv" width="700" height="700"></canvas>

  <div class="play">
    <button id="play">Play</button>
    <button id="pause">Pause</button>
    <button id="stepBack">◀︎</button>
    <button id="stepForward">▶︎</button>
    <label>Position: <input id="scrub" type="range" min="0" max="100" value="0" step="1"/></label>
    <span id="scrubInfo"></span>
    <label>Speed <input id="speed" type="range" min="0.2" max="5" value="1" step="0.1"/></label>
    <div id="info"></div>
  </div>
</div>

<script src="./app.js"></script>
</body>
</html>
