services:
  # Backend API
  - type: web
    name: wall-finisher-backend
    env: python
    region: singapore
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn backend.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.0
      - key: DATABASE_URL
        value: sqlite:///./trajectories.sqlite3
    
  # Frontend (Static Site)
  - type: web
    name: wall-finisher-frontend
    env: static
    region: singapore
    plan: free
    buildCommand: echo "No build needed"
    staticPublishPath: ./frontend
    routes:
      - type: rewrite
        source: /api/*
        destination: https://wall-finisher-backend.onrender.com/api/*
